<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120e1c" />
  <title>Mastergoon</title>
  <meta name="description" content="Le jeu multijoueur où il ne faut surtout pas dire la même chose que le Mastergoon." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="reactions-layer" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <div id="connecting" class="connecting">
    <div class="connecting-box">
      <div class="spinner"></div>
      <p class="connecting-title">Connexion au serveur…</p>
      <p class="connecting-sub">Si le serveur dormait, il se réveille (jusqu'à une minute). Ne ferme pas la page.</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/sound.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
